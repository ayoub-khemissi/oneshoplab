# OneShopLab — Shopify app configuration (Shopify CLI: `shopify app deploy`).
# Keep in sync with docs/api/SHOPIFY-APP-STORE.md. The client id is public;
# the secret lives only in .env (SHOPIFY_APP_CLIENT_SECRET).
# client_id = "…"  ← fill with SHOPIFY_APP_CLIENT_ID before `shopify app config link`

name = "OneShopLab"
application_url = "https://oneshoplab.com/shopify"
embedded = true

[access_scopes]
scopes = "read_products,write_products,write_files"
# Shopify-managed installation: the merchant installs from the App Store, the
# embedded app exchanges its ID token for an offline token (token exchange).
use_legacy_install_flow = false

[auth]
# Only used by the website's "connect my store" flow (authorization code grant).
redirect_urls = ["https://oneshoplab.com/api/integrations/shopify/callback"]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled", "app_subscriptions/update", "app_purchases_one_time/update"]
  uri = "https://oneshoplab.com/api/webhooks/shopify/app"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "https://oneshoplab.com/api/webhooks/shopify/gdpr/customers-data-request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "https://oneshoplab.com/api/webhooks/shopify/gdpr/customers-redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "https://oneshoplab.com/api/webhooks/shopify/gdpr/shop-redact"

[pos]
embedded = false
