# Embedded apps (Shopify admin, Wix dashboard) — nginx side (http context).
# Installed as /etc/nginx/conf.d/00-oneshoplab-embedded.conf and used by the
# prod and staging vhosts (see docs/api/SHOPIFY-APP-STORE.md → "Framing").
#
# Inside a store admin every page of the app is a framed document, and
# browsers say so: Sec-Fetch-Dest: iframe. For those documents only:
#   - no X-Frame-Options, and a frame-ancestors limited to the two admins
#     (the app narrows it further per admin, src/proxy.ts);
#   - Shopify only: App Bridge injected as the very first tags of <head>
#     (App Store requirement 2.2.3: before any other script — Next.js emits
#     its own scripts first, so the app cannot do it itself). Wix pages are
#     told apart by their path (/wix) or their session parameter (osl_token)
#     and get none: the app adds its own Wix bridge (wix-bridge.ts);
#   - the upstream answers uncompressed so sub_filter can see <head>
#     (nginx gzips the result).
map $http_sec_fetch_dest $osl_framed {
    iframe  1;
    default 0;
}
map $osl_framed $osl_x_frame_options {
    1       "";
    default "DENY";
}
map $osl_framed $osl_frame_ancestors {
    1       "https://admin.shopify.com https://*.myshopify.com https://manage.wix.com https://*.wix.com";
    default "'none'";
}
map "$osl_framed|$uri|$arg_osl_token" $osl_app_bridge {
    "~^1\|/wix(/|\|)"   "";
    "~^1\|[^|]*\|.+"    "";
    "~^1\|"             '<meta name="shopify-api-key" content="a0e73ac54ac812b328f60fda04371316"><script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>';
    default              "";
}
map $osl_framed $osl_upstream_accept_encoding {
    1       "";
    default $http_accept_encoding;
}
