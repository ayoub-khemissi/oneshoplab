name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three independent jobs so wall-clock ≈ the slowest one (~1 min), not the sum.
# The browser smoke suite lives in e2e.yml (slower, non-blocking).
jobs:
  checks:
    name: Lint · types · i18n · format · deps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (errors block; warnings are the ratchet)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: i18n parity + key usage
        run: pnpm i18n:check
      - name: Format check
        run: pnpm format:check
      - name: Import cycles (madge)
        run: pnpm deps:circular
      - name: Dependency audit (critical only)
        run: pnpm audit:prod
      - name: Migrations in sync with schema
        run: pnpm drizzle-kit check

  unit:
    name: Vitest (unit + MySQL suites)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oneshoplab_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests
        env:
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/oneshoplab_test
        run: pnpm test

  build:
    name: Next build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'messages/**', 'pricing.json') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        env:
          # Build-time public config only; no secrets are needed to compile.
          # DATABASE_URL is read at import time (src/lib/db/index.ts) but mysql2
          # only connects lazily, so a placeholder is enough to collect page data.
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
          APP_URL: https://oneshoplab.com
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ''
        run: pnpm build && test -s .next/BUILD_ID
