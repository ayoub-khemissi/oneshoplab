name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oneshoplab_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (single source).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint (errors block; warnings are the ratchet)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: i18n parity + key usage
        run: pnpm i18n:check
      - name: Import cycles (madge)
        run: pnpm deps:circular

      - name: Tests (vitest — unit + ledger/webhook against MySQL)
        env:
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/oneshoplab_test
        run: pnpm test

      - name: Format check
        run: pnpm format:check
      - name: Dependency audit (critical only)
        run: pnpm audit:prod
      - name: Migrations in sync with schema
        run: pnpm drizzle-kit check
      - name: Build
        env:
          # Build-time public config only; no secrets are needed to compile.
          # DATABASE_URL is read at import time (src/lib/db/index.ts) but mysql2
          # only connects lazily, so a placeholder is enough to collect page data.
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
          APP_URL: https://oneshoplab.com
          # Empty on purpose: the e2e run below serves this build and must not
          # load Google's widget (no network, no keys).
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ''
        run: pnpm build && test -s .next/BUILD_ID

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke (Playwright against next start + MySQL)
        env:
          CI: '1'
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/oneshoplab_test
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
