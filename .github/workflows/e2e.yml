name: E2E + DB suites

# Browser smoke suite (Playwright): ~5 min, so it runs beside CI instead of
# inside it — on every push to main and on demand. A red run here is a real
# regression on a user journey; see docs/GUIDELINES.md → E2E smoke.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oneshoplab_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'messages/**', 'pricing.json') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: DB suites (vitest against MySQL)
        env:
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/oneshoplab_test
        run: pnpm test:db
      - name: Build (served by the tests)
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/oneshoplab_test
          APP_URL: http://127.0.0.1:3031
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ''
        run: pnpm build
      - name: Playwright browser cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Smoke tests
        env:
          CI: '1'
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/oneshoplab_test
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
