<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OneShopLab — offline</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #fafdff; color: #191a19; text-align: center; padding: 2rem;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) { body { background: #020409; color: #e9eef7; } }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.25rem; margin: 1.25rem 0 0.5rem; }
      p { margin: 0; opacity: 0.7; max-width: 26rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="OneShopLab" />
      <h1>No connection</h1>
      <p>OneShopLab needs the network to read your catalog. This page will load again as soon as you are back online.</p>
    </main>
  </body>
</html>
