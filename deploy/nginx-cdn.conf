# cdn.oneshoplab.com — read-only public edge in front of a PRIVATE
# Cloudflare R2 bucket. DNS stays on Hostinger; this nginx (OVH) is the
# only thing that can read the bucket: public r2.dev access is OFF and
# every upstream request is SigV4-signed with a dedicated read-only R2
# token (see deploy/r2-sign.js + the root-only secrets conf).
#
# Install order: see deploy/RUNBOOK-cdn.md. The secrets conf
# (js_var $r2_*) and the js_import live in a separate root-600 file so
# the token never sits in a world-readable config.

proxy_cache_path /var/cache/nginx/r2cdn
    levels=1:2
    keys_zone=r2cdn:50m
    max_size=5g
    inactive=7d
    use_temp_path=off;

server {
    server_name cdn.oneshoplab.com;

    client_max_body_size 1m;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;

    # proxy_pass uses a variable ($r2_s3_host) → nginx resolves the
    # upstream at request time and needs an explicit resolver.
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    access_log /var/log/nginx/cdn_access.log;
    error_log  /var/log/nginx/cdn_error.log warn;

    # Asset domain: read-only, nothing else. Anything but GET/HEAD is
    # refused before we even sign — the R2 token is read-only too, so
    # this is defence in depth.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # SigV4 material, computed once per request from $msec so every
    # js_set agrees on the timestamp.
    js_set $r2_amzdate       r2sign.amzDate;
    js_set $r2_authorization r2sign.authorization;
    js_set $r2_canonical_uri r2sign.canonicalUri;

    location / {
        # Path-style S3: /<bucket>/<key>. The njs canonicalUri builds
        # exactly this, and we proxy_pass the same string so the
        # signature matches byte-for-byte.
        proxy_pass https://$r2_s3_host$r2_canonical_uri;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $r2_s3_host;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Upstream sees only what SigV4 signed.
        proxy_set_header Host $r2_s3_host;
        proxy_set_header Authorization $r2_authorization;
        proxy_set_header x-amz-date $r2_amzdate;
        proxy_set_header x-amz-content-sha256
            e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855;
        # Never forward client cookies / auth to R2.
        proxy_set_header Cookie "";
        proxy_set_header Connection "";

        # Edge cache on local disk — UUID keys are immutable, so a long
        # TTL is safe and shields R2 from scraping / egress cost. Serve
        # stale on an R2 blip rather than 5xx the page.
        proxy_cache r2cdn;
        proxy_cache_key "$r2_canonical_uri";
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 403 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Strip provider/internal headers from the response.
        proxy_hide_header Set-Cookie;
        proxy_hide_header cf-ray;
        proxy_hide_header cf-cache-status;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-version-id;
        proxy_intercept_errors off;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/cdn.oneshoplab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.oneshoplab.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# http→https + keep ACME renewals working over port 80.
server {
    listen 80;
    listen [::]:80;
    server_name cdn.oneshoplab.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
